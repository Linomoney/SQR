<!DOCTYPE html>
<html lang="id">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, shrink-to-fit=no">
    <title>Artikel – Saung Quran Rabbani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'sqr-bg': '#f0f8d3', 'sqr-green': '#2d4a22', 'sqr-orange': '#e67e22', 'sqr-light-green': '#a3c585', 'sqr-dark': '#1c3115' },
                    fontFamily: { 'montserrat': ['Montserrat', 'sans-serif'], 'poppins': ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
            font-size: clamp(14px, 1.2vw, 17px);
            min-height: 100%;
        }

        body {
            background-color: #f0f8d3;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            max-width: 100%;
            min-height: 100vh;
        }

        .font-title {
            font-family: 'Montserrat', sans-serif;
        }

        @media (max-width: 1023px) {
            html {
                font-size: 4vw !important;
            }

            .header-media-img {
                max-height: 280px !important;
                border-radius: 1rem !important;
            }

            .article-content img {
                max-height: 260px !important;
            }
        }

        /* ===== LAYOUT MODE OVERRIDES ===== */
        html.desktop-site-mode {
            font-size: 15px !important;
        }

        .article-content p {
            margin-bottom: 1rem;
            line-height: 1.75;
            color: #374151;
            font-size: 0.95rem;
        }

        .article-content img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 1rem;
            margin: 1.25rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .article-content .block-image-caption {
            text-align: center;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: -0.75rem;
            margin-bottom: 1.25rem;
            font-style: italic;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            margin: 1.25rem 0;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .header-media-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        #loadingArtikel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            gap: 1rem;
        }

        @media print {

            nav,
            footer,
            button,
            .tag-badge,
            .border-t,
            #shareModal {
                display: none !important;
            }

            body {
                background: white !important;
                color: black !important;
            }

            #artikelContainer {
                max-width: 100% !important;
                padding: 0 !important;
            }

            .header-media-img {
                max-height: 350px !important;
            }
        }
    </style>
    <script>
        (function () {
            // GAS MOBILE FIX: screen.width tidak terpengaruh GAS viewport 980px
            function updateLayoutMode() {
                var ua = navigator.userAgent;
                var isMobileUA = /Mobile|Android|iPhone|iPod|IEMobile|Opera Mini/i.test(ua);
                var screenW = (window.screen && window.screen.width) ? window.screen.width : window.innerWidth;
                var html = document.documentElement;
                var isMobileDevice = isMobileUA && screenW < 768;
                if (isMobileDevice) {
                    html.classList.add('mobile-site-mode');
                    html.classList.remove('desktop-site-mode');
                } else {
                    html.classList.add('desktop-site-mode');
                    html.classList.remove('mobile-site-mode');
                }
            }
            updateLayoutMode();
            window.addEventListener('resize', updateLayoutMode);
        })();
    </script>
</head>

<body>

    <!-- NAVBAR -->
    <nav
        class="sticky top-0 z-50 bg-sqr-green/95 backdrop-blur-md shadow-lg px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button type="button" onclick="goBack()"
                class="bg-white/20 hover:bg-white/30 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </button>
            <img src="https://res.cloudinary.com/ddh5nkwv7/image/upload/v1782638700/logo_sqr_atzzpb.png" alt="Logo SQR"
                class="w-8 h-8 rounded-full object-cover shadow-md">
            <span class="font-title font-black text-white text-sm hidden md:block">Artikel SQR</span>
        </div>
        <button type="button" onclick="shareArtikel()"
            class="bg-sqr-orange hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md cursor-pointer">
            <i class="fa-solid fa-share-nodes"></i> Bagikan
        </button>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="max-w-3xl mx-auto px-4 py-8" id="artikelContainer">
        <!-- Loading State -->
        <div id="loadingArtikel">
            <i class="fa-solid fa-spinner fa-spin text-sqr-orange text-3xl"></i>
            <p class="text-sm text-sqr-green font-semibold">Memuat artikel...</p>
        </div>
        <!-- Article Content (populated by JS) -->
        <div id="artikelBody" class="hidden"></div>
    </div>

    <!-- MODAL BAGIKAN ARTIKEL & SIMPAN PDF -->
    <div id="shareModal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4">
        <div onclick="closeShareModal()" class="absolute inset-0"></div>
        <div
            class="bg-white rounded-3xl p-6 w-full max-w-sm relative z-10 shadow-2xl border border-gray-100 animate__animated animate__fadeInUp">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-title font-bold text-base text-sqr-green flex items-center gap-2">
                    <i class="fa-solid fa-share-nodes text-sqr-orange"></i> Bagikan Artikel
                </h3>
                <button type="button" onclick="closeShareModal()" class="text-gray-400 hover:text-gray-600 p-1"><i
                        class="fa-solid fa-times text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <button type="button" onclick="copyArticleLink()"
                    class="w-full text-left p-3.5 rounded-2xl border border-sqr-green/20 hover:bg-sqr-bg font-bold text-xs flex justify-between items-center text-sqr-green transition">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-link text-sqr-orange text-base"></i>
                        Salin Link Artikel</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
                </button>
                <button type="button" onclick="shareToWhatsApp()"
                    class="w-full text-left p-3.5 rounded-2xl border border-emerald-200 hover:bg-emerald-50 font-bold text-xs flex justify-between items-center text-emerald-700 transition">
                    <span class="flex items-center gap-2.5"><i
                            class="fa-brands fa-whatsapp text-emerald-500 text-lg"></i> Bagikan via WhatsApp</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
                </button>
                <button type="button" onclick="downloadAsPdf()"
                    class="w-full text-left p-3.5 rounded-2xl border border-red-200 hover:bg-red-50 font-bold text-xs flex justify-between items-center text-red-700 transition">
                    <span class="flex items-center gap-2.5"><i class="fa-solid fa-file-pdf text-red-500 text-lg"></i>
                        Cetak / Simpan PDF</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-sqr-dark text-white text-center py-6 mt-8">
        <p class="text-xs opacity-60">&copy; 2026 Saung Quran Rabbani</p>
    </footer>

    <script>
        function getGasBaseUrl() {
            var url = '';
            try {
                if (window.top && window.top.location && window.top.location.href) {
                    url = window.top.location.href;
                }
            } catch (e) { }
            if (!url && typeof window.__GAS_BASE_URL__ !== 'undefined' && window.__GAS_BASE_URL__) {
                url = window.__GAS_BASE_URL__;
            }
            if (!url) {
                url = window.location.href;
            }
            return url.split('?')[0].split('#')[0];
        }

        function goBack() {
            if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                window.location.href = 'index.html';
            } else {
                var url = getGasBaseUrl();
                window.top.location.href = url + '?page=home';
            }
        }

        function shareArtikel() {
            var modal = document.getElementById('shareModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeShareModal() {
            var modal = document.getElementById('shareModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function getArticleFullUrl() {
            var baseUrl = getGasBaseUrl();
            var articleId = (typeof window.__ARTICLE_ID__ !== 'undefined' && window.__ARTICLE_ID__) ? window.__ARTICLE_ID__ : '';
            if (!articleId) {
                var urlParams = new URLSearchParams(window.location.search);
                articleId = urlParams.get('articleId') || '';
            }
            if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return window.location.href;
            }
            return baseUrl + '?page=artikel&articleId=' + articleId;
        }

        function copyArticleLink() {
            var url = getArticleFullUrl();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function () {
                    alert('Link artikel berhasil disalin!');
                    closeShareModal();
                }).catch(function () {
                    fallbackCopyText(url);
                });
            } else {
                fallbackCopyText(url);
            }
        }

        function fallbackCopyText(text) {
            var dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            alert('Link artikel berhasil disalin!');
            closeShareModal();
        }

        function shareToWhatsApp() {
            var title = document.title || 'Artikel SQR';
            var url = getArticleFullUrl();
            var text = '*' + title + '*\n\nBaca artikel selengkapnya di Saung Quran Rabbani:\n' + url;
            window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
            closeShareModal();
        }

        function downloadAsPdf() {
            closeShareModal();
            setTimeout(function () {
                window.print();
            }, 300);
        }

        function getCategoryStyle(cat) {
            var m = {
                'Kegiatan': 'background:#d1fae5;color:#065f46',
                'Acara': 'background:#dbeafe;color:#1e40af',
                'Pengumuman': 'background:#fef3c7;color:#92400e',
                'Umum': 'background:#f3f4f6;color:#374151'
            };
            return m[cat] || m['Umum'];
        }

        function isYoutubeUrl(url) {
            return /youtu\.be|youtube\.com/i.test(url);
        }

        function getYoutubeEmbedUrl(url) {
            var vid = '';
            var m = url.match(/[?&]v=([^&#]+)/);
            if (m) vid = m[1];
            else {
                m = url.match(/youtu\.be\/([^?#]+)/);
                if (m) vid = m[1];
            }
            return vid ? 'https://www.youtube.com/embed/' + vid : url;
        }

        function isVideoFile(url) {
            return /\.(mp4|webm|ogg|mov)(\?|$)/i.test(url);
        }

        function renderMediaHeader(mediaUrl, mediaType) {
            if (!mediaUrl) return '';
            if (mediaType === 'video' || isYoutubeUrl(mediaUrl)) {
                if (isYoutubeUrl(mediaUrl)) {
                    var embedUrl = getYoutubeEmbedUrl(mediaUrl);
                    return '<div class="video-wrapper mb-6"><iframe src="' + embedUrl + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
                } else if (isVideoFile(mediaUrl)) {
                    return '<div class="video-wrapper mb-6"><video controls><source src="' + mediaUrl + '"><p class="text-xs text-gray-500 p-4">Browser Anda tidak mendukung video ini.</p></video></div>';
                }
            }
            return '<img src="' + mediaUrl + '" alt="Gambar artikel" class="header-media-img mb-6" onerror="this.style.display=\'none\'">';
        }

        function renderContentBlocks(blocks) {
            if (!blocks || !blocks.length) return '';
            var html = '';
            blocks.forEach(function (block) {
                if (block.type === 'paragraph' && block.text) {
                    html += '<p>' + block.text.replace(/\n/g, '<br>') + '</p>';
                } else if (block.type === 'image' && block.url) {
                    html += '<img src="' + block.url + '" alt="' + (block.caption || '') + '" onerror="this.style.display=\'none\'">';
                    if (block.caption) html += '<p class="block-image-caption">' + block.caption + '</p>';
                } else if (block.type === 'video') {
                    if (isYoutubeUrl(block.url || '')) {
                        var embed = getYoutubeEmbedUrl(block.url);
                        html += '<div class="video-wrapper"><iframe src="' + embed + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
                    } else {
                        html += '<div class="video-wrapper"><video controls><source src="' + block.url + '"></video></div>';
                    }
                    if (block.caption) html += '<p class="block-image-caption">' + block.caption + '</p>';
                } else if (block.type === 'heading' && block.text) {
                    html += '<h2 class="font-title font-bold text-sqr-green text-lg mt-6 mb-2">' + block.text + '</h2>';
                } else if (block.type === 'quote' && block.text) {
                    html += '<blockquote class="border-l-4 border-sqr-orange pl-4 my-4 italic text-gray-600">' + block.text + '</blockquote>';
                }
            });
            return html;
        }

        function renderArtikel(article) {
            if (!article) {
                document.getElementById('loadingArtikel').innerHTML =
                    '<div class="text-center py-16"><i class="fa-solid fa-file-circle-xmark text-5xl text-gray-300 mb-4"></i><p class="text-gray-400 font-semibold">Artikel tidak ditemukan</p><button type="button" onclick="goBack()" class="mt-4 bg-sqr-green text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md cursor-pointer">Kembali ke Beranda</button></div>';
                return;
            }
            document.title = article.title + ' – SQR';
            var catStyle = getCategoryStyle(article.category);
            var headerMedia = renderMediaHeader(article.mediaUrl, article.mediaType);
            var bodyBlocks = renderContentBlocks(article.contentBlocks);

            var html = '';
            // Category badge & meta
            html += '<div class="mb-4 flex flex-wrap items-center gap-2">';
            html += '<span class="tag-badge" style="' + catStyle + '">' + article.category + '</span>';
            html += '<span class="text-xs text-gray-400">' + article.publishedAt + '</span>';
            html += '<span class="text-xs text-gray-400">· Oleh ' + article.authorName + '</span>';
            html += '</div>';
            // Title
            html += '<h1 class="font-title font-black text-sqr-green text-xl md:text-3xl leading-tight mb-5">' + article.title + '</h1>';
            // Header Media (video or image)
            if (article.mediaUrl) html += headerMedia;
            // Excerpt / sub title if no blocks
            if (article.excerpt && (!article.contentBlocks || !article.contentBlocks.length)) {
                html += '<div class="article-content"><p>' + article.excerpt + '</p></div>';
            }
            // Content blocks
            if (article.contentBlocks && article.contentBlocks.length) {
                html += '<div class="article-content">' + bodyBlocks + '</div>';
            }
            // Share footer
            html += '<div class="border-t border-gray-200 mt-8 pt-5 flex items-center justify-between">';
            html += '<button type="button" onclick="goBack()" class="text-xs text-sqr-green font-bold flex items-center gap-1.5 hover:underline cursor-pointer"><i class="fa-solid fa-arrow-left"></i> Semua Artikel</button>';
            html += '<button type="button" onclick="shareArtikel()" class="bg-sqr-orange text-white font-bold px-4 py-2 rounded-full text-xs transition flex items-center gap-1.5 shadow-md cursor-pointer"><i class="fa-solid fa-share-nodes"></i> Bagikan / Simpan PDF</button>';
            html += '</div>';

            document.getElementById('loadingArtikel').style.display = 'none';
            var body = document.getElementById('artikelBody');
            body.innerHTML = html;
            body.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', function () {
            // Baca articleId dari URL parameter
            var urlParams = new URLSearchParams(window.location.search);
            var articleId = urlParams.get('articleId') || (typeof window.__ARTICLE_ID__ !== 'undefined' ? window.__ARTICLE_ID__ : '');

            if (!articleId) {
                document.getElementById('loadingArtikel').innerHTML =
                    '<div class="text-center py-16"><i class="fa-solid fa-file-circle-xmark text-5xl text-gray-300 mb-4"></i><p class="text-gray-400 font-semibold">Artikel tidak ditemukan</p><button type="button" onclick="goBack()" class="mt-4 bg-sqr-green text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md cursor-pointer">Kembali ke Beranda</button></div>';
                return;
            }

            google.script.run
                .withSuccessHandler(function (article) { renderArtikel(article); })
                .withFailureHandler(function (err) {
                    document.getElementById('loadingArtikel').innerHTML =
                        '<div class="text-center py-8 text-red-400 text-sm"><i class="fa-solid fa-circle-exclamation mr-2"></i>Gagal memuat artikel: ' + (err && err.message ? err.message : err) + '</div>';
                })
                .getArticleById(articleId);
        });
    </script>
</body>

</html>
