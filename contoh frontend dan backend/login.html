<!DOCTYPE html>
<html lang="id">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, shrink-to-fit=no">
    <title>Login SQR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { 'sqr-green': '#2d4a22', 'sqr-orange': '#e67e22', 'sqr-bg': '#f0f8d3' }
            }}
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { overflow-x: hidden; max-width: 100%; font-size: clamp(14px, 1.2vw, 17px); min-height: 100%; }
        body { min-height: 100vh; overflow-x: hidden; max-width: 100%; }
        @media (max-width: 1023px) {
            html { font-size: 3.8vw !important; }
            .login-card { width: 88% !important; max-width: 850px !important; padding: 2.2rem 1.8rem !important; border-radius: 28px !important; }
            input {
                font-size: 1rem !important;
                padding: 14px 16px !important;
                min-height: 50px !important;
            }
            label {
                font-size: 0.85rem !important;
                margin-bottom: 6px !important;
            }
            button {
                font-size: 1rem !important;
                min-height: 50px !important;
            }
        }

        /* ===== DESKTOP SITE MODE OVERRIDE ===== */
        html.desktop-site-mode { font-size: 15px !important; }
        html.desktop-site-mode .login-card { width: 100% !important; max-width: 24rem !important; padding: 2rem !important; border-radius: 1rem !important; }
        html.desktop-site-mode input { font-size: 0.875rem !important; padding: 0.75rem 1rem !important; min-height: 42px !important; }
        html.desktop-site-mode label { font-size: 0.75rem !important; margin-bottom: 0.25rem !important; }
        html.desktop-site-mode button { font-size: 0.875rem !important; min-height: 44px !important; }
    </style>
    <script>
        (function() {
            var ua = navigator.userAgent;
            var isMobileUA = /Mobile|Android|iPhone|iPod|IEMobile|Opera Mini/i.test(ua);
            var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (!isMobileUA && hasTouch) {
                document.documentElement.classList.add('desktop-site-mode');
            }
        })();
    </script>
</head>
<body class="bg-sqr-bg flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm login-card">
        <div class="text-center mb-6">
            <div class="bg-sqr-green text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-sqr-green">Login SQR</h1>
            <p class="text-xs text-gray-500 mt-1">Akses dashboard ustadz, wali, atau admin</p>
        </div>

        <div id="loginError" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4"></div>

        <div class="mb-4">
            <label class="block text-xs font-bold text-gray-600 mb-1">Email</label>
            <input type="email" id="email" placeholder="email@example.com"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sqr-orange text-sm">
        </div>
        <div class="mb-6">
            <label class="block text-xs font-bold text-gray-600 mb-1">Password</label>
            <input type="password" id="password" placeholder="••••••••"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sqr-orange text-sm">
        </div>
        <button id="loginBtn" onclick="doLogin()"
                class="w-full bg-sqr-green hover:bg-green-900 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard
        </button>
        <p class="text-center text-xs text-gray-500 mt-5">
            Belum punya akun? <a href="https://wa.me/6281293721163?text=Halo%20Admin%20SQR%2C%20saya%20butuh%20bantuan%20pembuatan%20akun" target="_blank" class="text-sqr-orange font-bold hover:underline inline-flex items-center gap-1"><i class="fa-brands fa-whatsapp text-sm"></i> Hubungi admin SQR via WhatsApp (081293721163)</a>
        </p>
        <div class="mt-4 text-center">
            <a id="homeBtn" href="#" onclick="goHome()" class="inline-flex items-center gap-2 text-xs text-sqr-green font-semibold hover:underline">
                <i class="fa-solid fa-house"></i> Kembali ke Beranda SQR
            </a>
        </div>
    </div>

    <script>
        // Base URL otomatis dari server (via window.__GAS_BASE_URL__), fallback ke URL lama
        var GAS_BASE_URL = (typeof window.__GAS_BASE_URL__ !== 'undefined' && window.__GAS_BASE_URL__)
            ? window.__GAS_BASE_URL__
            : window.location.href.split('?')[0];

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function doLogin() {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('loginBtn');
            const errDiv   = document.getElementById('loginError');

            if (!email || !password) {
                showError('Email dan password wajib diisi.');
                return;
            }

            btn.disabled   = true;
            btn.innerHTML  = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
            errDiv.classList.add('hidden');

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        try { localStorage.setItem('sessionToken', result.sessionToken); } catch(e) {}
                        // Gunakan window.top agar halaman utama dialihkan keluar dari iframe sandbox
                        window.top.location.href = GAS_BASE_URL + '?page=dashboard&token=' + result.sessionToken;
                    } else {
                        showError(result.message || 'Login gagal. Periksa email dan password.');
                        btn.disabled  = false;
                        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard';
                    }
                })
                .withFailureHandler(function(err) {
                    showError('Terjadi kesalahan server: ' + (err.message || err));
                    btn.disabled  = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard';
                })
                .login(email, password);
        }

        function showError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', function() {
          const msg = new URLSearchParams(window.location.search).get('msg');
          if (msg) showError(decodeURIComponent(msg));
          // Update tombol Home dengan URL yang benar
          var homeBtn = document.getElementById('homeBtn');
          if (homeBtn) homeBtn.href = GAS_BASE_URL + '?page=home';
        });

        function goHome() {
            window.top.location.href = GAS_BASE_URL + '?page=home';
        }
    </script>
</body>
</html>
